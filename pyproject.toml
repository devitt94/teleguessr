[project]
name = "teleguessr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.1",
    "bs4>=0.0.2",
    "geoguessr-async>=1.1.0",
    "html2text>=2025.4.15",
    "loguru>=0.7.3",
    "pydantic>=2.12.2",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.1.1",
    "python-telegram-bot[job-queue]>=22.5",
    "typer>=0.21.1",
]

[project.optional-dependencies]
analysis = [
    "polars>=1.38.1",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "ruff>=0.14.1",
]

[tool.uv.sources]
geoguessr-async = { git = "https://github.com/devitt94/geoguessr_async" }
